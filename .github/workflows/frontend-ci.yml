name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          # Setup dummy build variables to pass Next.js compilation check
          NEXT_PUBLIC_API_URL: "https://wordsage-l10x.onrender.com"
          BACKEND_URL: "https://wordsage-l10x.onrender.com"
          NEXTAUTH_SECRET: "MShWATVyF/sS9nh/MkHGiTMOjeK54r9yGJqhhs2kgQg="
          NEXTAUTH_URL: "https://wordsage.vercel.app"
